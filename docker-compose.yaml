  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${DB_PASSWORD}@postgres:5432/banana_intel
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: banana_intel
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_CREATION_TOKEN: ${ADMIN_CREATION_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/code/src
      - ./backend/.env:/code/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped
    command: uvicorn src:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
