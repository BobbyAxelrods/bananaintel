version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: banana
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d banana"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    volumes:
      - mongo_data:/data/db
    restart: always
    
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${DB_PASSWORD}@postgres:5432/banana
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: banana_intel
      MILVUS_URI: http://milvus-standalone:19530
      SECRET_KEY: ${SECRET_KEY}
      DB_PASSWORD: ${DB_PASSWORD}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
      DOMAIN: https://imbanana.cc
      MAIL_USERNAME: admin@imbanana.cc
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

volumes:
  postgres_data:
  mongo_data:
